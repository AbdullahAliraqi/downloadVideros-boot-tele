name: piped-live-check

on:
  push:
  workflow_dispatch:

jobs:
  piped:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance:
          - https://pipedapi.tokhmi.xyz
          - https://pipedapi.moomoo.me
          - https://pipedapi.syncpundit.io
          - https://api-piped.mha.fi
          - https://piped-api.garudalinux.org
          - https://pipedapi.rivo.lol
          - https://piped-api.privacy.com.de
          - https://pipedapi.adminforge.de
          - https://api.piped.yt
          - https://pipedapi.drgns.space
    steps:
      - name: Query Piped streams endpoint
        env:
          PIPED_API: ${{ matrix.instance }}
          VIDEO_ID: pOj_k8_svi8
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --max-time 30             "${PIPED_API}/streams/${VIDEO_ID}"             -o response.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("response.json").read_text())
          assert isinstance(data, dict), "response is not an object"
          streams = data.get("videoStreams")
          assert isinstance(streams, list), "videoStreams missing"
          supported = {}
          for item in streams:
              if not isinstance(item, dict):
                  continue
              mime = str(item.get("mimeType") or "").lower()
              height = item.get("height")
              url = item.get("url")
              if mime == "video/mp4" and height in (1080, 720, 480) and url:
                  supported[height] = str(url)
          print("title:", data.get("title"))
          print("duration:", data.get("duration"))
          print("supported MP4 heights:", sorted(supported, reverse=True))
          assert supported, "no supported MP4 stream returned"
          target = next(height for height in (1080, 720, 480) if height in supported)
          Path("stream_url.txt").write_text(supported[target])
          print("selected height:", target)
          PY

      - name: Verify selected CDN stream is reachable
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --max-time 30             --range 0-1023             -o /dev/null             "$(cat stream_url.txt)"
          echo "CDN stream range request succeeded"
