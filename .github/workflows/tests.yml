name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate Docker Compose
        env:
          BOT_TOKEN: test-token
          TELEGRAM_API_ID: "123456"
          TELEGRAM_API_HASH: test-hash
          YOUTUBE_COMPANION_SECRET_KEY: A1b2C3d4E5f6G7h8
        run: docker compose config --quiet
      - name: Build Blitz image
        run: docker build --platform linux/amd64 -t telegram-video-bot-blitz:test .
      - name: Verify bundled service binaries and entrypoint
        run: |
          docker run --rm -e BLITZ_SINGLE_CONTAINER=false telegram-video-bot-blitz:test sh -c 'test -x /usr/local/bin/telegram-bot-api && test -x /usr/local/bin/invidious_companion'
          docker run --rm -e BLITZ_SINGLE_CONTAINER=false telegram-video-bot-blitz:test sh -n /app/scripts/blitz_entrypoint.sh
          docker run --rm -e BLITZ_SINGLE_CONTAINER=false telegram-video-bot-blitz:test sh -c 'ldd /usr/local/bin/telegram-bot-api 2>&1 | grep -q "not found" && exit 1 || true'
          docker run --rm -e BLITZ_SINGLE_CONTAINER=false telegram-video-bot-blitz:test telegram-bot-api --help >/dev/null
      - name: Verify Telegram credential compatibility
        run: |
          docker run --rm -e BLITZ_PREFLIGHT_ONLY=true -e BOT_TOKEN=test-token telegram-video-bot-blitz:test true
