name: tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TELEGRAM_RUNTIME_AUTOSTART: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8,<9"

      - name: Run tests
        run: pytest -q

      - name: Validate Docker Compose
        env:
          BOT_TOKEN: test-token
          WEBHOOK_BASE_URL: https://example.test
        run: docker compose config --quiet

      - name: Build Blitz image
        run: docker build --platform linux/amd64 -t telegram-video-bot-blitz:test .

      - name: Verify lightweight runtime
        run: |
          docker run --rm telegram-video-bot-blitz:test ffmpeg -version
          docker run --rm telegram-video-bot-blitz:test ffprobe -version
          docker run --rm telegram-video-bot-blitz:test gunicorn --check-config wsgi:app
          docker run --rm telegram-video-bot-blitz:test sh -c 'test -f /app/cookies.txt'
          docker run --rm telegram-video-bot-blitz:test sh -c '! test -x /usr/local/bin/telegram-bot-api'
          docker run --rm telegram-video-bot-blitz:test sh -c '! test -e /opt/camoufox'
