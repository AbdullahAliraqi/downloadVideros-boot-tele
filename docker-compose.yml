services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-video-bot:latest
    container_name: telegram-video-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TELEGRAM_MAX_UPLOAD_MB: "50"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      DOWNLOAD_ROOT: /data/downloads
      YTDLP_PROXY_URL: ${YTDLP_PROXY_URL:-}
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
      YOUTUBE_IPV6_BLOCK: ${YOUTUBE_IPV6_BLOCK:-}
      YTDLP_COOKIES_FILE: /run/secrets/cookies.txt
      TELEGRAM_RUNTIME_AUTOSTART: "true"
    volumes:
      - telegram_bot_downloads:/data/downloads
      - ${YTDLP_COOKIES_DIR:-./.secrets}:/run/secrets:ro
    ports:
      - "8000:8000"

volumes:
  telegram_bot_downloads:
