services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-video-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    expose:
      - "8081"
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-video-bot-bot:latest
    container_name: telegram-video-bot
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_MODE: "true"
      TELEGRAM_MAX_UPLOAD_MB: "2000"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      DOWNLOAD_ROOT: /data/downloads
    volumes:
      - telegram_bot_downloads:/data/downloads
    command: ["python", "-m", "app.local_runner"]

volumes:
  telegram_bot_api_data:
  telegram_bot_downloads:
